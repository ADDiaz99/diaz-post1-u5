<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservas de Laboratorios</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        table { border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #999; padding: .4rem .7rem; text-align: left; }
        .ok { color: #1b5e20; }
        .error { color: #b71c1c; font-weight: bold; }
    </style>
</head>
<body>
<h1>Reservas de Laboratorios</h1>

<p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>

<a th:href="@{/reservas/nueva}">Nueva reserva</a>

<p th:if="${#lists.isEmpty(reservas)}">Todavía no hay reservas registradas.</p>

<table th:unless="${#lists.isEmpty(reservas)}">
    <thead>
    <tr>
        <th>Laboratorio</th><th>Solicitante</th><th>Inicio</th><th>Fin</th><th>Estado</th><th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${reservas}">
        <td th:text="${r.laboratorio.nombre}"></td>
        <td th:text="${r.nombreSolicitante}"></td>
        <td th:text="${#temporals.format(r.inicio, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${#temporals.format(r.fin, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${r.estado}"></td>
        <td>
            <form th:if="${r.estado.name() != 'CANCELADA'}"
                  th:action="@{/reservas/{id}/cancelar(id=${r.id})}" method="post">
                <button type="submit">Cancelar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
