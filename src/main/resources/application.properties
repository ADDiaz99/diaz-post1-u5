spring.application.name=reservas-labs-api

# H2: base de datos embebida
spring.datasource.url=jdbc:h2:mem:reservas_labs_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Formato ISO para LocalDateTime en formularios (input datetime-local envia
# "2026-12-01T09:00"). Sin esto, el binding de @ModelAttribute en la vista
# Thymeleaf no sabe convertir el texto a LocalDateTime.
spring.mvc.format.date-time=iso

# Puerto del servidor
server.port=8080
